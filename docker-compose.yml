# n8n local para a Aula 10 (no lugar do docker-compose.yml da Aula 09).
# Neste computador o n8n já existe como o contêiner "n8n"; basta:
#   docker start n8n
#   curl http://localhost:5678/healthz   -> {"status":"ok"}
# Em outra máquina, sem esse contêiner: docker compose up -d
# O volume n8n_data guarda a conta, as credenciais, os workflows e a Data table chamados.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Cuiaba
      - TZ=America/Cuiaba
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    external: true
